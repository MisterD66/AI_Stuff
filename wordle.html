
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WORTLE - Deutsches Wordle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#538d4e;--yellow:#b59f3b;--gray:#3a3a3c;--dark:#121213;--light:#d7dadc;--key-bg:#818384;--correct:#538d4e;--present:#b59f3b;--absent:#3a3a3c;--border:#3a3a3c;--border-light:#565758}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--dark);color:var(--light)}
body{display:flex;flex-direction:column;max-width:500px;margin:0 auto;position:relative;touch-action:manipulation}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);min-height:50px;flex-shrink:0}
.header h1{font-size:22px;font-weight:700;letter-spacing:3px}
.header-btns{display:flex;gap:8px;align-items:center}
.header-btns button{background:none;border:none;color:var(--light);font-size:20px;cursor:pointer;padding:4px 8px}
.lives{display:flex;gap:2px;font-size:18px}
.lives .heart{transition:all .3s}
.lives .heart.lost{opacity:.25;transform:scale(.8)}
.lives .heart.gained{animation:heartbeat .5s}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
.screen.hidden{display:none}

/* LOGIN */
.login-screen{justify-content:center;align-items:center;padding:20px}
.login-box{text-align:center;max-width:320px;width:100%}
.login-box h2{font-size:28px;margin-bottom:8px}
.login-box p{color:#818384;margin-bottom:24px;font-size:14px}
.login-box input{width:100%;padding:14px 16px;font-size:18px;background:#1a1a1b;border:2px solid var(--border);border-radius:8px;color:var(--light);text-align:center;outline:none;margin-bottom:16px}
.login-box input:focus{border-color:var(--light)}
.login-box input::placeholder{color:#565758}
.btn-primary{width:100%;padding:14px;font-size:18px;font-weight:700;background:var(--correct);color:#fff;border:none;border-radius:8px;cursor:pointer;letter-spacing:1px}
.btn-primary:active{opacity:.8}

/* GAME */
.game-screen{flex:1;display:flex;flex-direction:column;min-height:0;height:100%}
.level-info{text-align:center;padding:4px;font-size:13px;color:#818384;flex-shrink:0}
.board-container{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:5px;width:min(85vw,340px);height:min(85vw,340px)}
.cell{border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.5vw,34px);font-weight:700;text-transform:uppercase;transition:transform .25s;aspect-ratio:1/1;min-width:0;min-height:0}
.cell.filled{border-color:var(--border-light);animation:popIn .1s}
.cell.reveal{animation:flipIn .5s}
@keyframes popIn{0%{transform:scale(.85)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes flipIn{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}55%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.cell.correct{background:var(--correct);border-color:var(--correct);animation:flipIn .5s}
.cell.present{background:var(--present);border-color:var(--present);animation:flipIn .5s}
.cell.absent{background:var(--absent);border-color:var(--absent);animation:flipIn .5s}

/* KEYBOARD */
.keyboard{flex-shrink:0;padding:6px 4px 12px;display:flex;flex-direction:column;gap:6px;max-width:500px;width:100%}
.kb-row{display:flex;gap:4px;justify-content:center}
.key{height:clamp(42px,8vh,56px);border:none;border-radius:4px;font-size:clamp(13px,2.5vw,16px);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;max-width:42px;color:var(--light);background:var(--key-bg);transition:background .2s,transform .1s;user-select:none;-webkit-user-select:none}
.key:active{transform:scale(.95)}
.key.wide{max-width:64px;flex:1.5;font-size:12px;letter-spacing:.5px}
.key.correct{background:var(--correct);color:#fff}
.key.present{background:var(--present);color:#fff}
.key.absent{background:#333;color:#555}
.key.disabled{pointer-events:none}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.hidden{display:none}
.modal{background:#1a1a1b;border:1px solid var(--border);border-radius:12px;padding:24px;max-width:360px;width:100%;text-align:center}
.modal h2{font-size:22px;margin-bottom:12px}
.modal p{color:#818384;font-size:14px;margin-bottom:16px;line-height:1.5}
.modal .big-num{font-size:48px;font-weight:700;color:var(--correct);margin:8px 0}
.modal .stars{font-size:32px;margin:8px 0}
.modal-btn{padding:12px 24px;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;margin:4px;letter-spacing:.5px}
.modal-btn.primary{background:var(--correct);color:#fff}
.modal-btn.secondary{background:#333;color:var(--light)}
.modal-btn:active{opacity:.8}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--light);color:var(--dark);padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;z-index:200;animation:toastIn .3s,toastOut .3s 1.5s forwards;pointer-events:none;text-align:center;max-width:90%}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* STATS TABLE */
.stats-container{max-height:300px;overflow-y:auto;margin:12px 0;text-align:left}
.stats-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.stats-row .name{color:var(--light);font-weight:600}
.stats-row .level{color:var(--correct);font-weight:700;font-size:16px}

/* CONFETTI */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* WAIT SCREEN */
.wait-screen{justify-content:center;align-items:center;padding:20px;text-align:center}
.wait-screen h2{font-size:24px;margin-bottom:12px}
.wait-screen .timer{font-size:48px;font-weight:700;color:var(--correct);margin:16px 0}
.wait-screen p{color:#818384;font-size:14px;margin-bottom:8px}

/* NO LIVES SCREEN */
.no-lives-screen{justify-content:center;align-items:center;padding:20px;text-align:center}
.no-lives-screen h2{font-size:24px;margin-bottom:8px}
.no-lives-screen .big-heart{font-size:64px;margin:16px 0}
.no-lives-screen p{color:#818384;font-size:14px;margin-bottom:16px;line-height:1.5}

/* HIGHSCORE SCREEN */
.hs-screen{flex:1;overflow-y:auto;padding:16px}
.hs-screen h2{text-align:center;font-size:20px;margin-bottom:16px}
.hs-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);gap:12px}
.hs-rank{font-size:16px;font-weight:700;color:#818384;min-width:28px}
.hs-name{flex:1;font-weight:600;font-size:15px}
.hs-level{font-weight:700;color:var(--correct);font-size:16px}
.hs-empty{color:#818384;text-align:center;padding:40px;font-size:14px}
.hs-back{display:block;margin:16px auto;padding:12px 32px;background:#333;color:var(--light);border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen login-screen" id="loginScreen">
  <div class="login-box">
    <h2>WORTLE</h2>
    <p>Deutsche Wörter. 6 Buchstaben. Wie weit kommst du?</p>
    <input type="text" id="nameInput" placeholder="Dein Name" maxlength="20" autocomplete="off" autocapitalize="words">
    <button class="btn-primary" onclick="doLogin()">SPIELEN</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen game-screen hidden" id="gameScreen">
  <div class="header">
    <div class="lives" id="livesDisplay"></div>
    <h1>WORTLE</h1>
    <div class="header-btns">
      <button onclick="showHighscores()" title="Highscore">&#127942;</button>
      <button onclick="showStats()" title="Statistik">&#128202;</button>
    </div>
  </div>
  <div class="level-info" id="levelInfo">Level 1</div>
  <div class="board-container">
    <div class="board" id="board"></div>
  </div>
  <div class="keyboard" id="keyboard"></div>
</div>

<!-- NO LIVES SCREEN -->
<div class="screen no-lives-screen hidden" id="noLivesScreen">
  <div class="big-heart">&#10084;&#65039;</div>
  <h2>Keine Leben mehr!</h2>
  <p>Du hast alle Leben verbraucht.<br>Komm morgen wieder - du bekommst 1 neues Leben!</p>
  <div class="timer" id="waitTimer">--:--:--</div>
  <p id="waitText"></p>
  <button class="btn-primary" onclick="showHighscores()" style="max-width:260px;margin:12px auto">Highscore ansehen</button>
</div>

<!-- HIGHSCORE SCREEN -->
<div class="screen hs-screen hidden" id="hsScreen">
  <h2>&#127942; Highscore</h2>
  <div id="hsList" class="hs-empty">Lade Highscores...</div>
  <button class="hs-back" onclick="goBack()">Zurück</button>
</div>

<!-- MODALS -->
<div class="modal-overlay hidden" id="winModal">
  <div class="modal">
    <div class="stars" id="winStars"></div>
    <h2 id="winTitle">Geschafft!</h2>
    <div class="big-num" id="winGuesses"></div>
    <p id="winText"></p>
    <button class="modal-btn primary" onclick="nextLevel()">Weiter</button>
  </div>
</div>

<div class="modal-overlay hidden" id="loseModal">
  <div class="modal">
    <h2 style="color:var(--present)">Leider verloren</h2>
    <p id="loseText"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="modal-btn primary" onclick="nextLevel()">Weiter</button>
      <button class="modal-btn secondary" onclick="showHighscores()">Highscore</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="statsModal">
  <div class="modal">
    <h2>Deine Statistik</h2>
    <div id="statsContent"></div>
    <button class="modal-btn primary" onclick="closeStats()" style="margin-top:12px">Schließen</button>
  </div>
</div>

<div class="confetti-container" id="confetti"></div>

function setCookie(n,v,d){let e=new Date();e.setTime(e.getTime()+d*86400000);document.cookie=n+"="+encodeURIComponent(v)+";expires="+e.toUTCString()+";path=/;SameSite=Lax"}
function getCookie(n){let cs=document.cookie.split(";");for(let c of cs){let [k,v]=c.trim().split("=");if(k===n)return decodeURIComponent(v)}return null}

function saveState(){

function todayStr(){
  let d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function timeUntilMidnight(){
  let now=new Date();
  let next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0);
  return next-now;
}

function timeUntilNextLife(){
  if(state.lives>=MAX_LIVES)return null;
  return timeUntilMidnight();
}

function computeDailyLives(){
  let today=todayStr();
  if(state.lastLifeDay!==today){
    // New day → give 1 life
    state.lives=Math.min(MAX_LIVES,state.lives+1);
    state.lastLifeDay=today;
  }
}

// ============ API ============
async function supFetch(method,path,body){
  let opts={method,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"}};
  if(body){opts.body=JSON.stringify(body);opts.headers["Prefer"]="return=minimal,resolution=merge-duplicates"}
  let res=await fetch(SUPABASE_URL+"/rest/v1/"+path,opts);
  if(!res.ok){let t=await res.text();throw new Error("HTTP "+res.status+": "+t)}
  if(res.status===204)return null;
  return res.json();
}

async function fetchScores(){
  let data=await supFetch("GET","scores?order=level.desc")||[];
  let map=new Map();
  for(let r of data){
    let k=r.name.toLowerCase();
    let e=map.get(k);
    if(!e||r.level>e.level)map.set(k,r);
  }
  return Array.from(map.values());
}

function sortScores(scores){
  return scores.slice().sort((a,b)=>b.level-a.level||a.date-b.date);
}

function findRank(scores,name){
  let ranked=sortScores(scores);
  for(let i=0;i<ranked.length;i++){
    if(ranked[i].name.toLowerCase()===name.toLowerCase())return i+1;
  }
  return null;
}

function renderTop10(scores,currentName){
  let ranked=sortScores(scores).slice(0,10);
  if(ranked.length===0)return"<div class='hs-empty'>Noch keine Einträge</div>";
  let html="";
  ranked.forEach((s,i)=>{
    let isMe=s.name.toLowerCase()===currentName.toLowerCase();
    let hl=isMe?"style='background:rgba(83,141,78,.2);border-radius:6px;border-left:3px solid var(--correct)'":"";
    let livesStr=s.lives!=null?` <span style="color:#818384;font-size:12px">${s.lives}❤</span>`:"";
    html+=`<div class="hs-row" ${hl}><span class="hs-rank">#${i+1}</span><span class="hs-name">${escHtml(s.name)}${livesStr}</span><span class="hs-level">Level ${s.level}</span></div>`;
  });
  return html;
}

// ============ UPLOAD & RANK ============
async function uploadScore(){
  if(!state.user)return;
  state._lastRank=null;
  state._totalPlayers=0;
  hsError="";
  try{
    await supFetch("POST","scores",{name:state.user,level:state.level,date:Date.now(),lives:state.lives,last_day:state.lastLifeDay});
    let scores=await fetchScores();
    _lastScores=scores;
    state._totalPlayers=scores.length;
    let ranked=sortScores(scores);
    let idx=ranked.findIndex(s=>s.name.toLowerCase()===state.user.toLowerCase());
    if(idx!==-1)state._lastRank=idx+1;
  }catch(e){
    hsError="Fehler: "+e.message;
    console.error("Upload:",e);
  }
}

  let name=document.getElementById("nameInput").value.trim();
  if(!name){showToast("Bitte gib deinen Namen ein!");return}
  if(name.length<2){showToast("Name mindestens 2 Zeichen!");return}
  state.user=name;

  try{
    let data=await supFetch("GET","scores?order=level.desc")||[];
    let existing=data.find(s=>s.name.toLowerCase()===name.toLowerCase());
    if(existing){
      state.level=existing.level+1;
      state.lives=existing.lives!=null?existing.lives:MAX_LIVES;
      state.lastLifeDay=existing.last_day||"";
      computeDailyLives();
      saveState();
      showToast("Willkommen zurück! Level "+state.level);
    }else{
      saveState();
    }
  }catch(e){
    saveState();
  }

  startGame();
}

function checkLogin(){
  loadState();
  if(state.user){
    computeDailyLives();
    saveState();
    startGame();
  }else{
    showScreen("loginScreen");
  }
}

// ============ GAME ============
function startGame(){
  if(!hasLives()){showNoLives();return}
  state.lives=Math.max(0,state.lives-1);
  state.lastLifeUse=Date.now();
  saveState();
  state.guesses=[];
  state.currentGuess="";
  state.gameOver=false;
  showScreen("gameScreen");
  buildBoard();
  buildKeyboard();
  renderLives();
  renderLevelInfo();
  uploadScore();
}

function getCurrentWord(){return validWordsArr[WORD_IDS[(state.level-1)%WORD_IDS.length]].toUpperCase()}

function buildBoard(){
  let board=document.getElementById("board");
  board.innerHTML="";
  for(let r=0;r<GUESSES;r++){
    for(let c=0;c<6;c++){
      let cell=document.createElement("div");
      cell.className="cell";
      cell.id="cell"+r+"_"+c;
      board.appendChild(cell);
    }
  }
}

function buildKeyboard(){
  let kb=document.getElementById("keyboard");
  kb.innerHTML="";
  let rows=[["q","w","e","r","t","z","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["Enter","y","x","c","v","b","n","m","Del"]];
  rows.forEach(row=>{
    let rowDiv=document.createElement("div");
    rowDiv.className="kb-row";
    row.forEach(key=>{
      let btn=document.createElement("button");
      btn.className="key"+(key.length>1?" wide":"");
      btn.textContent=key==="Enter"?"ENTER":key==="Del"?"DEL":key.toUpperCase();
      btn.dataset.key=key;
      btn.onclick=()=>handleKey(key);
      rowDiv.appendChild(btn);
    });
    kb.appendChild(rowDiv);
  });
}

function handleKey(key){
  if(state.gameOver)return;
  if(key==="Del"){state.currentGuess=state.currentGuess.slice(0,-1)}
  else if(key==="Enter"){
    if(state.currentGuess.length<6){showToast("Zu kurz!");return}
    submitGuess();return;
  }else{
    if(state.currentGuess.length>=6)return;
    state.currentGuess+=key.toUpperCase();
  }
  renderCurrentRow();
}

function renderCurrentRow(){
  let row=state.guesses.length;
  for(let c=0;c<6;c++){
    let cell=document.getElementById("cell"+row+"_"+c);
    cell.textContent=state.currentGuess[c]||"";
    if(state.currentGuess[c])cell.classList.add("filled");
    else cell.classList.remove("filled");
  }
}

function submitGuess(){
  let word=getCurrentWord();
  let guess=state.currentGuess.toUpperCase();
  let row=state.guesses.length;

  if(validWords&&!validWords.has(guess.toLowerCase())){
    showToast("Kein gültiges Wort!");return;
  }

  let result=Array(6).fill("absent");
  let wordArr=word.split("");
  let guessArr=guess.split("");
  for(let i=0;i<6;i++){
    if(guessArr[i]===wordArr[i]){result[i]="correct";wordArr[i]=null;guessArr[i]=null}
  }
  for(let i=0;i<6;i++){
    if(guessArr[i]===null)continue;
    let idx=wordArr.indexOf(guessArr[i]);
    if(idx!==-1){result[i]="present";wordArr[idx]=null}
  }

  state.guesses.push(guess);
  state.currentGuess="";

  let delay=0;
  for(let c=0;c<6;c++){
    ((c,d)=>{
      setTimeout(()=>{
        let cell=document.getElementById("cell"+row+"_"+c);
        cell.classList.add("reveal",result[c]);
        updateKeyColor(guess[c],result[c]);
      },d);
    })(c,delay);
    delay+=300;
  }

  setTimeout(async()=>{
    let won=guess===word;
    if(won){
      state.gameOver=true;
      state.stats.won++;state.stats.played++;state.stats.streak++;
      state.stats.maxStreak=Math.max(state.stats.maxStreak,state.stats.streak);
      state.stats.dist[state.guesses.length-1]++;
      state.lives=Math.min(MAX_LIVES,state.lives+1);
      saveState();
      renderLives();
      showWinAnimation();
      await uploadScore();
      setTimeout(()=>showWinModal(),1500);
    }else if(state.guesses.length>=GUESSES){
      state.gameOver=true;
      state.stats.played++;state.stats.streak=0;
      saveState();
      renderLives();
      await uploadScore();
      setTimeout(()=>showLoseModal(),600);
    }
  },delay);
}

function updateKeyColor(letter,status){
  let btn=document.querySelector(`.key[data-key="${letter.toLowerCase()}"]`);
  if(!btn)return;
  let priority={correct:3,present:2,absent:1};
  let current=btn.classList.contains("correct")?"correct":btn.classList.contains("present")?"present":btn.classList.contains("absent")?"absent":null;
  if(!current||priority[status]>priority[current]){
    btn.classList.remove("correct","present","absent");
    btn.classList.add(status);
  }
}

function renderLives(){
  let el=document.getElementById("livesDisplay");
  let html="";
  for(let i=0;i<MAX_LIVES;i++){
    html+=`<span class="heart${i<state.lives?"":" lost"}">${i<state.lives?"❤️":"🤍"}</span>`;
  }
  el.innerHTML=html;
}

function renderLevelInfo(){
  document.getElementById("levelInfo").textContent=`Level ${state.level}`;
}

// ============ MODALS ============
function showWinAnimation(){
  let container=document.getElementById("confetti");
  container.innerHTML="";
  let colors=["#538d4e","#b59f3b","#818384","#fff","#e74c3c","#3498db","#f39c12","#9b59b6"];
  for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.width=(Math.random()*8+6)+"px";
    c.style.height=(Math.random()*8+6)+"px";
    c.style.borderRadius=Math.random()>.5?"50%":"0";
    c.style.animationDuration=(Math.random()*2+2)+"s";
    c.style.animationDelay=(Math.random()*1.5)+"s";
    container.appendChild(c);
  }
  setTimeout(()=>container.innerHTML="",5000);
}

function buildTop10Html(){
  if(_lastScores.length===0)return"";
  let ranked=sortScores(_lastScores).slice(0,10);
  let html=`<div style="text-align:left;margin-top:16px;border-top:1px solid var(--border);padding-top:12px"><div style="font-size:13px;color:#818384;margin-bottom:6px;text-align:center">Top 10</div>`;
  ranked.forEach((s,i)=>{
    let isMe=s.name.toLowerCase()===state.user.toLowerCase();
    let hl=isMe?"background:rgba(83,141,78,.2);border-left:3px solid var(--correct)":"";
    let borderR=isMe?"border-radius:6px":"";
    html+=`<div style="display:flex;align-items:center;padding:6px 8px;gap:8px;font-size:13px;${hl};${borderR}"><span style="color:#818384;min-width:24px;font-weight:700">#${i+1}</span><span style="flex:1;${isMe?"color:var(--correct);font-weight:700":"color:var(--light)"}">${escHtml(s.name)}</span><span style="color:var(--correct);font-weight:700">Lv ${s.level}</span></div>`;
  });
  html+=`</div>`;
  return html;
}

function showWinModal(){
  let guesses=state.guesses.length;
  let stars=guesses<=2?"⭐⭐⭐":guesses<=4?"⭐⭐":"⭐";
  document.getElementById("winStars").textContent=stars;
  document.getElementById("winTitle").textContent=`Level ${state.level} geschafft!`;
  document.getElementById("winGuesses").textContent=`${guesses}/${GUESSES}`;
  let msgs=["Genial!","Klasse!","Gut gemacht!","Nicht schlecht!","Knapp!","Puh, das war knapp!"];
  let baseMsg=msgs[guesses-1]||"Geschafft!";
  let extra="";
  if(state._lastRank)extra+=`<br><span style="color:var(--correct);font-size:16px">Platz #${state._lastRank} von ${state._totalPlayers}</span>`;
  if(hsError)extra+=`<br><span style="color:var(--present);font-size:11px">${escHtml(hsError)}</span>`;
  extra+=buildTop10Html();
  document.getElementById("winText").innerHTML=baseMsg+extra;
  document.getElementById("winModal").classList.remove("hidden");
}

function showLoseModal(){
  let word=getCurrentWord();
  let extra="";
  if(state._lastRank)extra=`<span style="color:var(--correct);font-size:15px">Platz #${state._lastRank} von ${state._totalPlayers}</span>`;
  if(hsError)extra+=`<br><span style="color:var(--present);font-size:11px">${escHtml(hsError)}</span>`;
  extra+=buildTop10Html();
  document.getElementById("loseText").innerHTML=`Das Wort war:<br><strong style="font-size:24px;color:var(--light)">${word}</strong><br><br>Du hast noch <strong>${state.lives}</strong> ${state.lives===1?"Leben":"Leben"}.<br>${extra}`;
  document.getElementById("loseModal").classList.remove("hidden");
}

function nextLevel(){
  document.getElementById("winModal").classList.add("hidden");
  document.getElementById("loseModal").classList.add("hidden");
  state.level++;
  if(state.level>WORD_IDS.length){showToast("Du hast alle Level geschafft!");state.level=WORD_IDS.length}
  saveState();
  if(!hasLives())showNoLives();
  else startGame();
}

// ============ HIGHSCORE SCREEN ============
function showHighscores(){showScreen("hsScreen");loadHighscoresFull()}

async function loadHighscoresFull(){
  let el=document.getElementById("hsList");
  el.innerHTML="Lade...";
  try{
    let scores=await fetchScores();
    el.innerHTML=renderTop10(scores,state.user||"");
  }catch(e){
    el.innerHTML="<div class='hs-empty'>Fehler: "+escHtml(e.message)+"</div>";
  }
}

// ============ NO LIVES ============
function showNoLives(){showScreen("noLivesScreen");updateWaitTimer()}

function updateWaitTimer(){
  let remaining=timeUntilNextLife();
  if(remaining===null||remaining<=0){
    document.getElementById("waitTimer").textContent="00:00:00";
    document.getElementById("waitText").textContent="Du hast ein Leben zurueck! Lade die Seite neu.";
    return;
  }
  let h=Math.floor(remaining/3600000);
  let m=Math.floor((remaining%3600000)/60000);
  let s=Math.floor((remaining%60000)/1000);
  document.getElementById("waitTimer").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  document.getElementById("waitText").textContent="Nächstes Leben um 0:00 Uhr:";
  setTimeout(updateWaitTimer,1000);
}

// ============ STATS ============
function showStats(){
  let s=state.stats;
  let html=`<div style="display:flex;justify-content:space-around;margin:16px 0">
    <div><div class="big-num" style="font-size:28px">${s.played}</div><div style="color:#818384;font-size:12px">Gespielt</div></div>
    <div><div class="big-num" style="font-size:28px">${s.played?Math.round(s.won/s.played*100):0}%</div><div style="color:#818384;font-size:12px">Gewonnen</div></div>
    <div><div class="big-num" style="font-size:28px">${s.streak}</div><div style="color:#818384;font-size:12px">Serie</div></div>
    <div><div class="big-num" style="font-size:28px">${s.maxStreak}</div><div style="color:#818384;font-size:12px">Max Serie</div></div>
  </div><div style="margin-top:8px"><div style="font-size:13px;color:#818384;margin-bottom:6px">Verteilung:</div>`;
  let maxDist=Math.max(...s.dist,1);
  for(let i=0;i<6;i++){
    let pct=Math.round(s.dist[i]/maxDist*100);
    html+=`<div style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:13px"><span style="width:12px;text-align:right">${i+1}</span><div style="flex:1;background:#333;border-radius:3px;height:18px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--correct);border-radius:3px"></div></div><span style="width:20px;text-align:right;color:#818384">${s.dist[i]}</span></div>`;
  }
  html+=`</div><div style="margin-top:12px;text-align:center;font-size:13px;color:#818384">Level: <strong style="color:var(--light)">${state.level}</strong> | Leben: <strong style="color:${state.lives>0?"var(--correct)":"var(--present)"}">${state.lives}/${MAX_LIVES}</strong></div>`;
  document.getElementById("statsContent").innerHTML=html;
  document.getElementById("statsModal").classList.remove("hidden");
}

function closeStats(){document.getElementById("statsModal").classList.add("hidden")}

// ============ HELPERS ============
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function showToast(msg){
  let t=document.createElement("div");
  t.className="toast";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function goBack(){
  if(hasLives())showScreen("gameScreen");
  else showScreen("noLivesScreen");
}

// ============ KEYBOARD ============
document.addEventListener("keydown",e=>{
  if(!document.getElementById("loginScreen").classList.contains("hidden"))return;
  if(!document.getElementById("gameScreen").classList.contains("hidden")){
    if(e.key==="Backspace")handleKey("Del");
    else if(e.key==="Enter")handleKey("Enter");
    else if(/^[a-zA-ZäöüÄÖÜ]$/.test(e.key))handleKey(e.key.toLowerCase());
  }
});

document.addEventListener("gesturestart",e=>e.preventDefault());

document.getElementById("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
checkLogin();
</script>
